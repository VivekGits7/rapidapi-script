[project]
name = "rapidapi-autoparts-dumper"
version = "0.1.0"
description = "Dumps the RapidAPI Auto Parts Catalog into Postgres. Resumable, rate-limit-aware, type-coded sequential IDs."
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    # Validation / config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    # DB
    "asyncpg>=0.29.0",
    # HTTP client
    "httpx>=0.27.0",
    # CLI
    "click>=8.1.7",
]
